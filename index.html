<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGO Control</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      padding: 40px 15px;
    }

    h1 {
      margin-bottom: 35px;
    }

    .buttons {
      max-width: 500px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    button {
      height: 100px;
      font-size: 28px;
      font-weight: bold;
      border: 0;
      border-radius: 18px;
      cursor: pointer;
      background: #374151;
      color: white;
    }

    button:active {
      transform: scale(.96);
    }
  </style>
</head>

<body>

<h1>Siemens LOGO Control</h1>

<div class="buttons">
  <button onclick="command(1)">Q1</button>
  <button onclick="command(2)">Q2</button>
  <button onclick="command(3)">Q3</button>
  <button onclick="command(4)">Q4</button>
</div>

<script>

const SERVER = "http://YOUR_STATIC_IP:5000";

async function command(q) {

  try {

    const response = await fetch(
      SERVER + "/api/q/" + q,
      {
        method: "POST"
      }
    );

    console.log(await response.text());

  }
  catch(error) {
    alert("Server connection error");
    console.error(error);
  }

}

</script>

</body>
</html>
